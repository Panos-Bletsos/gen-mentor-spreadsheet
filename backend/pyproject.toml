[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gen-mentor-backend"
version = "0.1.0"
description = "FastAPI backend for GenMentor - LLM-powered intelligent tutoring system with interactive spreadsheet exercises"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Panos Bletsos"}]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "langchain>=1.0.0",
    "langchain-core==1.2.7",
    "langchain-community==1.0.0a1",
    "langchain-openai>=1.1.7",
    "langchain-chroma>=1.0.0",
    "langchain-huggingface>=1.0.0",
    "langchain-deepseek>=1.0.1",
    "langchain-docling",
    "duckduckgo-search",
    "ddgs",
    "sentence-transformers",
    "hydra-core",
    "beautifulsoup4",
    "pypdf",
    "pdfplumber",
    "pypinyin",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[tool.setuptools]
packages = ["main"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true